name: 部署开发环境

on:
  push:
    branches: [at_home]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://wuziqi-dev.up.railway.app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
        env:
          NODE_ENV: development

      - name: 同步构建产物到 railway-frontend
        run: |
          echo "📦 同步构建产物到 railway-frontend/dist/..."
          rm -rf railway-frontend/dist
          cp -r dist railway-frontend/dist
          ls -la railway-frontend/dist/

      - name: 等待 Railway 自动部署
        run: |
          echo "⏳ 等待 Railway 自动部署完成..."
          echo "Railway 已通过 GitHub 集成自动部署"
          sleep 30

      - name: 健康检查
        run: |
          echo "🔍 检查开发环境..."
          curl -f https://wuziqi-railway-production.up.railway.app/health || exit 1
          echo "✅ 开发环境部署成功！"
