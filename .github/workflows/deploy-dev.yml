name: 部署开发环境

on:
  push:
    branches: [at_home]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://wuziqi-dev.up.railway.app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
        env:
          NODE_ENV: development

      - name: 安装 Railway CLI (3.x 版本支持旧版 Token)
        run: npm install -g @railway/cli@3.5.2

      - name: 诊断 CLI 版本
        run: railway --version

      - name: 检查 Railway CLI 支持的 Token 格式
        run: |
          echo "Railway CLI 版本:"
          railway --version
          echo ""
          echo "检查环境变量:"
          env | grep -i railway || echo "No RAILWAY env vars found"

      - name: 清除旧配置
        run: |
          rm -rf ~/.config/railway/
          rm -rf ~/.railway/
        continue-on-error: true

      - name: 设置 Railway Token
        run: echo "RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}" >> $GITHUB_ENV

      - name: 验证 Token 设置
        run: |
          echo "Token length: ${#RAILWAY_TOKEN}"
          echo "Token prefix: ${RAILWAY_TOKEN:0:4}"

      - name: 验证 Railway 环境
        run: |
          echo "RAILWAY_TOKEN 已设置，长度: ${#RAILWAY_TOKEN}"
          echo "Railway CLI 应该自动使用环境变量中的 Token"

      - name: 列出 Railway 项目
        run: railway list

      - name: 部署后端
        working-directory: ./railway-backend
        run: railway up --service wuziqi-backend

      - name: 部署前端
        working-directory: ./railway-frontend
        run: railway up --service wuziqi-frontend

      - name: 等待部署
        run: sleep 20

      - name: 健康检查
        run: |
          echo "🔍 检查开发环境..."
          curl -f https://wuziqi-dev.up.railway.app/health || exit 1
          echo "✅ 开发环境部署成功！"
