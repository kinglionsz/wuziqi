name: 部署开发环境

on:
  push:
    branches: [at_home]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://wuziqi-dev.up.railway.app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
        env:
          NODE_ENV: development

      - name: 安装 Railway CLI
        run: npm install -g @railway/cli

      - name: 登录 Railway
        run: railway login --headless ${{ secrets.RAILWAY_TOKEN }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: 选择开发项目
        run: railway project

      - name: 部署后端
        working-directory: ./railway-backend
        run: railway up --service backend-dev

      - name: 部署前端
        working-directory: ./railway-frontend
        run: railway up --service frontend-dev

      - name: 等待部署
        run: sleep 20

      - name: 健康检查
        run: |
          echo "🔍 检查开发环境..."
          curl -f https://wuziqi-dev.up.railway.app/health || exit 1
          echo "✅ 开发环境部署成功！"
