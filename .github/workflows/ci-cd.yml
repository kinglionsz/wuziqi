name: CI/CD Pipeline

on:
  push:
    branches: [at_home]
  pull_request:
    branches: [at_home]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================
  # Job 1: 代码质量检查
  # ============================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 运行 ESLint
        run: npm run lint
        continue-on-error: true

  # ============================================
  # Job 2: 前端构建测试
  # ============================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
        env:
          NODE_ENV: production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: 检查构建产物
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ 构建失败：未找到 index.html"
            exit 1
          fi
          echo "✅ 构建成功！"
          ls -lh dist/

  # ============================================
  # Job 3: 单元测试
  # ============================================
  test-unit:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm run test:run
        continue-on-error: true

      - name: 生成测试覆盖率报告
        run: npm run test:coverage
        continue-on-error: true

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # Job 4: E2E 测试
  # ============================================
  test-e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: [build-frontend]
    services:
      backend:
        image: node:24-slim
        ports:
          - 3000:3000
        options: >-
          --workdir /app
          --name backend-service

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps

      - name: 准备后端服务
        run: |
          echo "准备后端服务文件..."
          mkdir -p /tmp/backend
          cp -r railway-backend/* /tmp/backend/
          cp railway-backend/package*.json /tmp/backend/ || true

      - name: 启动后端服务
        run: |
          echo "启动后端服务..."
          cd /tmp/backend
          npm install --production
          npm start &
          sleep 10
          echo "后端服务启动完成"

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: 启动前端预览服务器
        run: |
          npx serve dist -l 5173 &
          sleep 5

      - name: 运行 E2E 测试
        run: |
          npx playwright test tests/
        continue-on-error: true
        env:
          CI: true

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================
  # Job 5: 构建并推送 Docker 镜像
  # ============================================
  build-and-push-docker:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    needs: [build-frontend, test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/at_home'
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: 同步构建产物到 railway-frontend
        run: |
          mkdir -p railway-frontend/dist
          rm -rf railway-frontend/dist/*
          cp -r dist/* railway-frontend/dist/
          echo "构建产物已同步到 railway-frontend/dist/"
          ls -la railway-frontend/dist/

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub（可选）
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: 生成后端镜像标签
        id: meta-backend
        run: |
          echo "tags=${{ github.repository }}-backend:latest,${{ github.repository }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 构建后端 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./railway-backend
          file: ./railway-backend/Dockerfile
          push: false
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成前端镜像标签
        id: meta-frontend
        run: |
          echo "tags=${{ github.repository }}-frontend:latest,${{ github.repository }}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 构建前端 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./railway-frontend/Dockerfile
          push: false
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 6: 部署到 Railway
  # ============================================
  deploy-railway:
    name: 部署到 Railway
    runs-on: ubuntu-latest
    needs: [build-and-push-docker, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/at_home'
    environment:
      name: production
      url: https://wuziqi-frontend-production.up.railway.app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: 同步构建产物到 railway-frontend
        run: |
          mkdir -p railway-frontend/dist
          rm -rf railway-frontend/dist/*
          cp -r dist/* railway-frontend/dist/
          echo "构建产物已同步到 railway-frontend/dist/"
          ls -la railway-frontend/dist/

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: 安装 Railway CLI
        run: |
          npm install -g @railway/cli

      - name: 登录 Railway
        run: |
          echo "调试: 开始执行Railway登录..."
          echo "命令: railway login --browserless"
          railway login --browserless
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: 部署后端服务
        working-directory: ./railway-backend
        run: |
          railway up --service backend

      - name: 部署前端服务
        working-directory: ./railway-frontend
        run: |
          railway up --service frontend

      - name: 等待部署完成
        run: |
          echo "⏳ 等待服务启动..."
          sleep 30

      - name: 健康检查
        run: |
          echo "🔍 执行健康检查..."
          
          # 检查后端健康状态
          BACKEND_URL="https://wuziqi-railway-production.up.railway.app/health"
          echo "检查后端: $BACKEND_URL"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL)
            echo "尝试 $((RETRY_COUNT + 1))/$MAX_RETRIES - HTTP 状态码: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ 后端健康检查通过！"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 10
            fi
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ 后端健康检查失败"
            exit 1
          fi

      - name: 获取部署信息
        run: |
          echo "📊 部署信息："
          railway status
          railway domain

  # ============================================
  # Job 7: 部署通知
  # ============================================
  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    needs: [deploy-railway]
    if: always()
    steps:
      - name: 发送成功通知
        if: needs.deploy-railway.result == 'success'
        run: |
          echo "🎉 部署成功！"
          echo "前端地址: https://wuziqi-frontend-production.up.railway.app"
          echo "后端地址: https://wuziqi-railway-production.up.railway.app"

      - name: 发送失败通知
        if: needs.deploy-railway.result != 'success'
        run: |
          echo "❌ 部署失败，请检查日志"
          exit 1
